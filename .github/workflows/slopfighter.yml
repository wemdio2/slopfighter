# slopfighter PR-comment workflow — copy this file into any repo as
# `.github/workflows/slopfighter.yml` to get a slop report on every PR.
#
# Free for public repos. For private repos it consumes your GitHub Actions
# minutes (typical scan: 5-30 seconds on a real project).

name: slopfighter

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mjs'
      - '**/*.cjs'

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan changed files
        id: scan
        run: |
          set +e
          # Get changed JS/TS files from the PR
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" \
            | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' \
            | grep -v -E '(^|/)(node_modules|dist|build|vendor|generated)/' || true)
          if [ -z "$CHANGED" ]; then
            echo "no relevant files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y slopfighter@latest scan $CHANGED --json > findings.json
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.scan.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const { score, findings } = data;
            const top = findings
              .sort((a, b) => ({ error: 0, warn: 1, info: 2 }[a.severity] - { error: 0, warn: 1, info: 2 }[b.severity]))
              .slice(0, 10);
            const grade = score.grade;
            const emoji = grade === 'A' ? '✅' : grade === 'B' ? '🟢' : grade === 'C' ? '🟡' : grade === 'D' ? '🟠' : '🔴';
            const body = [
              `${emoji} **slopfighter:** ${score.value}/100 (${grade}) — ${score.total} findings`,
              ``,
              `<details><summary>Top issues</summary>`,
              ``,
              ...top.map((f) => `- \`${f.file}:${f.line}\` **${f.severity}** ${f.message} _(${f.ruleId})_`),
              ``,
              `</details>`,
              ``,
              `_Powered by [slopfighter](https://github.com/YOUR-ORG/slopfighter) — \`npx slopfighter scan .\` locally._`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
